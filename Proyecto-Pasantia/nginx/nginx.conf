events {}

http {
  include mime.types;
  gzip on;

  server {
    listen 80;
    server_name _;   # Acepta cualquier IP o nombre de host

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — redirige rutas desconocidas al index.html
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Proxy al backend FastAPI
    location /api/ {
      proxy_pass         http://backend:8000;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # WebSockets
    location /ws/ {
      proxy_pass         http://backend:8000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
    }
  }

  # ── HTTPS opcional (certificados internos de la empresa) ──────────
  # Si la empresa provee certificados SSL, descomentar este bloque
  # y ajustar las rutas de los certificados:
  #
  # server {
  #   listen 443 ssl;
  #   server_name _;
  #
  #   ssl_certificate     /etc/ssl/certs/linea1metro.crt;
  #   ssl_certificate_key /etc/ssl/private/linea1metro.key;
  #
  #   root /usr/share/nginx/html;
  #   index index.html;
  #
  #   location / {
  #     try_files $uri $uri/ /index.html;
  #   }
  #
  #   location /api/ {
  #     proxy_pass         http://backend:8000;
  #     proxy_http_version 1.1;
  #     proxy_set_header   Host $host;
  #     proxy_set_header   X-Real-IP $remote_addr;
  #     proxy_set_header   X-Forwarded-Proto https;
  #   }
  #
  #   location /ws/ {
  #     proxy_pass         http://backend:8000;
  #     proxy_http_version 1.1;
  #     proxy_set_header   Upgrade $http_upgrade;
  #     proxy_set_header   Connection "upgrade";
  #   }
  # }
}
